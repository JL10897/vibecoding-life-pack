version: 1

pack:
  name: vibecoding-life-pack
  owner: yiranqu
  description: Personal vibecoding life pack for Cursor, Claude Code, and Codex skills.

agents:
  cursor:
    canonical_path: canonical/cursor
    install_targets:
      skills: ~/.cursor/skills
      rules: ~/.cursor/rules
      hooks_dir: ~/.cursor/hooks
      hooks_json: ~/.cursor/hooks.json
  claude-code:
    canonical_path: canonical/claude-code
    install_targets:
      skills: ~/.claude/skills
      commands: ~/.claude/commands
      settings: ~/.claude/settings
  codex:
    canonical_path: canonical/codex
    install_targets:
      skills: ~/.codex/skills
      prompts: ~/.codex/prompts
      settings: ~/.codex/settings

shared:
  canonical_path: canonical/shared
  areas:
    - principles
    - planning
    - debugging
    - review
  skills_path: canonical/shared/skills
  skills:
    - id: plan-revise
      status: active
      source: personal
      description: Revise existing plan documents while preserving logical consistency.
  fanout_targets:
    - ~/.cursor/skills
    - ~/.claude/skills
    - ~/.codex/skills
  absorb:
    entrypoint: bin/vibe-absorb-skills
    rule: Move non-symlink skill entries from consumer dirs into canonical/shared/skills and replace with symlinks.

skills:
  - id: plan-revise
    agent: shared
    path: canonical/shared/skills/plan-revise
    status: active
    source: personal
    description: "Revise existing plan documents while preserving logical consistency."
  - id: visual-report
    agent: shared
    path: canonical/shared/skills/visual-report
    status: active
    source: personal
    description: "Data analysis HTML report visualization design system (Morandi tones)."
  - id: claude-code-bypass
    agent: claude-code
    path: canonical/claude-code/skills/claude-code-bypass
    status: active
    source: personal
    description: "Enable Claude Code bypassPermissions mode under root on Linux."
  - id: paper-revise-abstract
    agent: shared
    path: canonical/shared/skills/paper-revise-abstract
    status: active
    source: personal
    description: "Revise abstract to meet top AI/NLP conference standards (NeurIPS, ICLR, ACL). Use when: (1) ..."
  - id: text-typeset
    agent: shared
    path: canonical/shared/skills/text-typeset
    status: active
    source: personal
    description: "Fix typographic widows - paragraphs ending with only 1-2 words on the last line. Use when: (..."
  - id: visual-art
    agent: shared
    path: canonical/shared/skills/visual-art
    status: active
    source: personal
    description: "Create beautiful visual art in .png and .pdf documents using design philosophy. You should u..."
  - id: citation-assistant
    agent: shared
    path: canonical/shared/skills/citation-assistant
    status: active
    source: personal
    description: "学术文献引用助手：找引用、BibTeX 生成、.bib 增删改查重、venue/作者质量(H-index)、填 [CITE] 占位。触发：文献引用/找引用/citation/bib/参考文献/add to bibliography/更新bib。"
  - id: paper-daily
