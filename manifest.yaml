external_packs:
  - id: anthropic-skills
    status: referenced
    source: external
    url: https://github.com/anthropics/skills
    description: "Anthropic official skills (pdf, docx, xlsx, pptx, mcp-builder, frontend-design, webapp-testing, etc.)."
    install_note: "Clone separately; not vendored. Customized copies (visual-slides, visual-art, visual-theme) live in canonical/shared/skills."
  - id: vercel-agent-skills
    status: referenced
    source: external
    url: https://github.com/vercel-labs/agent-skills
    description: "Vercel Labs agent-skills pack."
    install_note: "Clone separately; not vendored."
  - id: claude-skill-citation-checker
    status: referenced
    source: external
    url: https://github.com/PHY041/claude-skill-citation-checker
    description: "Third-party citation-checking skill."
    install_note: "Clone separately; not vendored. Own citation skill is citation-assistant in canonical/shared/skills."
  - id: notebooklm-skill
    status: dropped
    source: external
    url: https://github.com/PleasePrompto/notebooklm-skill
    description: "Third-party NotebookLM skill with browser auth; dropped from the pack."
    install_note: "Not vendored (carries auth state and .venv). Re-clone upstream if needed."
devices:
  strategy: canonical-plus-device-overrides
  override_root: devices
  rule: Keep overrides small. Promote reusable changes back into canonical.

autosave:
  enabled: true
  commit_scope: all
  push: false
  entrypoint: bin/vibe-save
  default_sources:
    - cursor-sessionEnd
    - claude-wrapper
    - codex-wrapper
    - manual
