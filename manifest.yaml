    status: active
    source: personal
    description: "每日论文推荐一句话总入口，内部自动串联抓取→点评→笔记三步流水线。全流程触发：今日论文推荐/过去3天论文/过去一周论文/看看这周有啥论文；单步触发：论文抓取/论文点评/批量笔记。"
  - id: text-coauthor
    agent: shared
    path: canonical/shared/skills/text-coauthor
    status: active
    source: personal
    description: "Guide users through a structured workflow for co-authoring documentation. Use when user want..."
